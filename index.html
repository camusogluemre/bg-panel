async function dec(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.v)},k,b64(P.c)));
}

async function go(pw){
  try{const html=await dec(pw);try{localStorage.setItem("panel_k",pw)}catch(e){}
      document.open();document.write(html);document.close();}
  catch(e){try{localStorage.removeItem("panel_k")}catch(_){}show("Şifre yanlış ya da sayfa güncellendi; şifreyi tekrar girin.");}
}
